<title>Kolonisten van Catan</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#faf6ee;--card:#fff;--ink:#2b2118;--mute:#7a6a5a;--line:#e6dccb;--acc:#b5451b;--acc2:#e9a23b;--ok:#2f7d4f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1c1713;--card:#272019;--ink:#f3eadc;--mute:#a8998a;--line:#3a3027;--acc:#e0714a;--acc2:#e9a23b;--ok:#5fc084}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1c1713;--card:#272019;--ink:#f3eadc;--mute:#a8998a;--line:#3a3027;--acc:#e0714a;--acc2:#e9a23b;--ok:#5fc084}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,"Times New Roman",serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.6rem;margin:4px 0 2px;color:var(--acc)}
.sub{color:var(--mute);font-size:.85rem;margin-bottom:14px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:20px;font:inherit;cursor:pointer}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
h2{font-size:1.05rem;margin:0 0 10px}
.status{padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--acc2) 22%,transparent);margin-bottom:12px;font-weight:bold}
.status.done{background:color-mix(in srgb,var(--ok) 22%,transparent)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-family:system-ui,sans-serif;font-size:.95rem}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:.75rem;color:var(--mute);font-weight:600}
td.n,th.n{text-align:left}
td.p{font-weight:bold;font-size:1.05rem}
tr.lead td{background:color-mix(in srgb,var(--acc2) 16%,transparent)}
.row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.row label{flex:1}
select,input{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input{width:100%}
select{min-width:150px}
button.pri{background:var(--acc);color:#fff;border:0;padding:10px 16px;border-radius:10px;font:inherit;cursor:pointer;width:100%}
button.lnk{background:none;border:0;color:var(--mute);cursor:pointer;font:inherit;font-size:.85rem;text-decoration:underline;padding:4px}
.err{color:var(--acc);font-size:.9rem;min-height:1.2em;margin:4px 0}
.g{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.g small{color:var(--mute)}
.sync{font-size:.75rem;color:var(--mute);text-align:center;margin-top:8px}

:root{--bg:#2b6f94;--card:#f7ecd2;--ink:#3b2a1a;--mute:#7d6648;--line:#d9c397;--acc:#a63d1a;--acc2:#e1a52a;--ok:#2f7d3a;--field:#fffaf0;--pat:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='52' height='90'><polygon points='26,0 52,15 52,45 26,60 0,45 0,15' fill='%232f6b2f' fill-opacity='.5' stroke='%23f3dfa6' stroke-opacity='.55' stroke-width='3'/><polygon points='0,45 26,60 26,90 0,105 -26,90 -26,60' fill='%23e1a52a' fill-opacity='.5' stroke='%23f3dfa6' stroke-opacity='.55' stroke-width='3'/><polygon points='52,45 78,60 78,90 52,105 26,90 26,60' fill='%23e1a52a' fill-opacity='.5' stroke='%23f3dfa6' stroke-opacity='.55' stroke-width='3'/><polygon points='0,-45 26,-30 26,0 0,15 -26,0 -26,-30' fill='%23e1a52a' fill-opacity='.5' stroke='%23f3dfa6' stroke-opacity='.55' stroke-width='3'/><polygon points='52,-45 78,-30 78,0 52,15 26,0 26,-30' fill='%23e1a52a' fill-opacity='.5' stroke='%23f3dfa6' stroke-opacity='.55' stroke-width='3'/></svg>")}

:root[data-theme="dark"]{--bg:#11364d;--card:#2d2417;--ink:#f1e4c6;--mute:#b9a37c;--line:#4a3a24;--acc:#d9683c;--ok:#6fcf7f;--field:#1f180f;--pat:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='52' height='90'><polygon points='26,0 52,15 52,45 26,60 0,45 0,15' fill='%231d4a24' fill-opacity='.45' stroke='%23f3dfa6' stroke-opacity='.55' stroke-width='3'/><polygon points='0,45 26,60 26,90 0,105 -26,90 -26,60' fill='%23a8781a' fill-opacity='.45' stroke='%23f3dfa6' stroke-opacity='.55' stroke-width='3'/><polygon points='52,45 78,60 78,90 52,105 26,90 26,60' fill='%23a8781a' fill-opacity='.45' stroke='%23f3dfa6' stroke-opacity='.55' stroke-width='3'/><polygon points='0,-45 26,-30 26,0 0,15 -26,0 -26,-30' fill='%23a8781a' fill-opacity='.45' stroke='%23f3dfa6' stroke-opacity='.55' stroke-width='3'/><polygon points='52,-45 78,-30 78,0 52,15 26,0 26,-30' fill='%23a8781a' fill-opacity='.45' stroke='%23f3dfa6' stroke-opacity='.55' stroke-width='3'/></svg>")}
body{background:var(--pat),var(--bg);background-attachment:fixed}
.hd{background:var(--card);border:3px solid #7a4a1e;border-radius:14px;padding:12px 14px;margin-bottom:14px;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.hd h1{margin:6px 0 2px;letter-spacing:.5px}
.hd .sub{margin:0}
.hexrow{display:flex;justify-content:center;gap:6px}
.hexrow i{width:26px;height:30px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.card{border:2px solid #8b5a2b;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.tab{border:2px solid #8b5a2b;font-weight:bold}
.tab.on{border-color:#5c3513}
select,input{background:var(--field)}
.status{border:2px solid #8b5a2b}

body{background:var(--bg)}
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 50% 30%,#4aa0c6 0%,#2b6f94 55%,#1b4a66 100%)}
#bg svg{position:absolute;left:50%;top:-24%;width:max(1150px,170vw);transform:translateX(-50%) perspective(1200px) rotateX(52deg);transform-origin:50% 40%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #bg{filter:brightness(.55)}}
:root[data-theme="dark"] #bg{filter:brightness(.55)}
main{position:relative;z-index:1}
.card,.status,.hd{background:color-mix(in srgb,var(--card) 95%,transparent)}
.status{background:color-mix(in srgb,var(--acc2) 40%,var(--card))}
.status.done{background:color-mix(in srgb,var(--ok) 35%,var(--card))}
.card,.status,.hd{background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.status{background:color-mix(in srgb,var(--acc2) 45%,var(--card) 55%)}
.status.done{background:color-mix(in srgb,var(--ok) 38%,var(--card) 62%)}

:root{--c-rood:#c62828;--c-blauw:#1565c0;--c-wit:#fff;--c-groen:#2e7d32;--c-geel:#f2b705;--c-bruin:#6d4c41}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c-rood:#ff7a6e;--c-blauw:#6fb0ff;--c-groen:#66d17a;--c-geel:#ffd23f;--c-bruin:#c49a7c}}
:root[data-theme="dark"]{--c-rood:#ff7a6e;--c-blauw:#6fb0ff;--c-groen:#66d17a;--c-geel:#ffd23f;--c-bruin:#c49a7c}
.pc-rood{color:var(--c-rood)}.pc-blauw{color:var(--c-blauw)}.pc-wit{color:var(--c-wit)}.pc-groen{color:var(--c-groen)}.pc-geel{color:var(--c-geel)}.pc-bruin{color:var(--c-bruin)}

[class*="pc-"]{font-weight:bold;text-shadow:0 0 1px rgba(59,42,26,.6),0 0 1px rgba(59,42,26,.6)}
.row input{flex:1;min-width:0}
.frow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.dots{display:flex;gap:7px}
.d{display:inline-block;width:20px;height:20px;border-radius:50%;border:2px solid rgba(59,42,26,.55);box-sizing:border-box}
.d.e{background:transparent;border:2px dashed var(--line)}
.d.w{background:#2e9d4f}.d.s{background:#f2b705}.d.t{background:#d32f2f}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--mute);margin-top:10px}
.leg .d{width:12px;height:12px;border-width:1px;margin-right:5px;vertical-align:middle}

<body>
<div id="bg"></div>
<main>
<div class="hd"><div class="hexrow"><i style="background:#2f6b2f"></i><i style="background:#b5451b"></i><i style="background:#9ccc65"></i><i style="background:#e9b53b"></i><i style="background:#8a8f99"></i></div><h1>Kolonisten van Catan</h1></div>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
<div class="sync" id="sync"></div>
<div style="text-align:center;margin-top:4px" id="who"></div>
<div class="sync" id="ver" style="margin-bottom:12px">v1.0</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
var delAsk=false,planOpen=false,grafOpen=false,cupScr=false,cupAsk='',cupPend=null,setOpen=false,KL={rood:'Rood',blauw:'Blauw',wit:'Wit',groen:'Groen',geel:'Geel',bruin:'Bruin'},S={comps:[]},cur=null,addOpen=false,ref=null,access=false,accOpen=false,vcodeAdmin="",viewer=false,codeAsk=false,vcode=null,pollT=null,loginMsg="",sess=null,sb=null,chan=null,loaded=false,edit=false,beker=false;
var $=function(i){return document.getElementById(i)};
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function uid(){return Math.random().toString(36).slice(2,9)}
function sync(t){$("sync").textContent=t}
function authMsg(e){var m=(e.message||"").toLowerCase();
  if(m.indexOf("invalid login")>-1)return "E-mailadres of wachtwoord klopt niet.";
  if(m.indexOf("already registered")>-1)return "Dit e-mailadres heeft al een account. Log in.";
  if(m.indexOf("password")>-1&&m.indexOf("6")>-1)return "Kies een wachtwoord van minstens 6 tekens.";
  if(m.indexOf("not confirmed")>-1)return "Bevestig eerst je e-mailadres via de mail die je kreeg.";
  if(m.indexOf("rate limit")>-1)return "Te veel pogingen. Probeer het over een paar minuten opnieuw.";
  if(m.indexOf("signups not allowed")>-1)return "Nieuwe accounts zijn uitgeschakeld.";
  return e.message||"Er ging iets mis."}
function normCode(x){return String(x||"").toLowerCase().replace(/[^a-z0-9]/g,"")}
function fmtCode(c){return c.replace(/(.{4})(?=.)/g,"$1-")}
function genCode(){var al="abcdefghjkmnpqrstuvwxyz23456789",a=new Uint8Array(24),o="",i;crypto.getRandomValues(a);for(i=0;i<24;i++)o+=al[a[i]%al.length];return o}
function loginCard(){return '<div class="card"><h2>Meekijken</h2><p><small>Heb je een toegangscode? Vul die hier in.</small></p><p><input id="vcode" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="Toegangscode"></p><div class="err" id="vce"></div><button class="pri" id="vc">Bekijk de stand</button></div><div class="card"><h2>Beheerder</h2><p><input id="em" type="email" autocomplete="username" placeholder="E-mailadres"></p><p><input id="pw" type="password" autocomplete="current-password" placeholder="Wachtwoord"></p><div class="err" id="ae"></div><button class="pri" id="li">Inloggen</button></div>'}
function accessView(){
  var link=vcodeAdmin?location.origin+location.pathname+"?code="+vcodeAdmin:"";
  var h='<div class="card"><h2>🔑 Toegangscode</h2><p><small>Wie deze code heeft, ziet de stand van alle competities, maar kan niets wijzigen. Deel de code alleen met vrienden.</small></p>';
  if(!vcodeAdmin)h+='<p><small>Er is nog geen code.</small></p><button class="pri" id="cg">Toegangscode maken</button>';
  else{
    h+='<p><small>Code</small><br><input id="cv" readonly value="'+attr(fmtCode(vcodeAdmin))+'" style="font-family:monospace"></p><p><small>Link om te delen</small><br><input id="cl" readonly value="'+attr(link)+'"></p><button class="pri" id="cc">Kopieer link</button><div class="err" id="ce"></div>';
    h+=codeAsk?'<p><b>Een nieuwe code maakt de oude ongeldig: iedereen moet daarna de nieuwe code invullen. Doorgaan?</b></p><button class="pri" id="cy">Ja, nieuwe code maken</button><p style="text-align:center"><button class="lnk" id="cn">Annuleren</button></p>':'<p style="text-align:center"><button class="lnk" id="cr">Nieuwe code maken (de oude vervalt)</button></p>';
  }
  return h+'</div>';
}
function loadCode(){
  sb.from("app_settings").select("view_code").eq("id",1).maybeSingle().then(function(r){if(r.error)sync("Laden mislukt: "+r.error.message);vcodeAdmin=(r.data&&r.data.view_code)||"";render()});
}
function saveCode(code){
  sb.from("app_settings").upsert({id:1,view_code:code}).then(function(r){
    if(r.error){sync("Opslaan mislukt: "+r.error.message);return}
    vcodeAdmin=code;codeAsk=false;render()});
}
function loadViewer(){
  if(!viewer)return;
  sb.rpc("get_league_by_code",{p_code:vcode}).then(function(r){
    if(!viewer)return;
    if(r.error){sync("Laden mislukt: "+r.error.message);return}
    if(!r.data){stopViewer("Deze toegangscode klopt niet (meer).");return}
    S=r.data.comps?r.data:{comps:[]};sync("Alleen kijken. De stand ververst elke halve minuut.");loaded=true;render()});
}
function startViewer(code){
  vcode=code;viewer=true;sess=null;access=true;edit=false;
  $("who").innerHTML='<button class="lnk" id="lo">Stoppen met meekijken</button>';
  sync("Laden...");loadViewer();clearInterval(pollT);pollT=setInterval(loadViewer,30000);
}
function stopViewer(msg){
  viewer=false;vcode=null;clearInterval(pollT);try{localStorage.removeItem("catan_code")}catch(e){}
  S={comps:[]};loginMsg=msg||"";$("who").innerHTML="";render();
}
function persist(){
  if(!sb||!edit)return;
